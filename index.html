<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <link
      rel="shortcut icon"
      href="./assets/icons/pokeball.png"
      type="image/x-icon"
    />

    <!-- CSS files -->
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/pokemon.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="body" onload="init()">
    <header>
      <div class="header-left">
        <img
          src="./assets/icons/pokeball.png"
          alt="Pokeball"
          class="pokeball-logo"
        />
        <h1>Pokedex</h1>
      </div>

      <div class="input-container">
        <input
          aria-label="search for pokemon"
          onfocusout="hideInputMinText()"
          oninput="checkInput()"
          id="filter-pokemon-input"
          type="text"
          placeholder="search for pokemon"
        />
        <p id="input-min-text" class="visibility-hidden">min 3 letters</p>
      </div>
    </header>

    <main id="main">
      <div id="loading-spinner" class="loading-spinner-container">
        <img
          class="loading-spinner"
          src="./assets/icons/pokeball.png"
          alt="Pokeball"
        />
        <p>loading...</p>
      </div>

      <section id="pokemon-section" class="pokemon-section"></section>

      <h2 id="no-pkm-found-h2" class="no-pkm-found display-none">
        no pokemon found...
      </h2>

      <section id="load-more-section" class="load-more-section"></section>
    </main>

    <dialog id="pokemon-dialog" class="pokemon-dialog"></dialog>

    <footer>
      <div class="da-logo">
        <div aria-label="Developer Akademie Logo" class="da-logo-top">
          <img src="./assets/icons/da_icon.svg" alt="Developer Akademie Icon" />
          <img
            src="./assets/icons/da_logo_text.svg"
            alt="Developer Akademie Logo-Text"
          />
        </div>
        <p class="da-logo-bottom">&copy; 2026 Developer Akademie GmbH</p>
      </div>
    </footer>
  </body>
  <!-- scripts -->
  <script src="scripts/templates.js"></script>
  <script src="./scripts/detailed-card.js"></script>
  <script src="script.js"></script>
</html>
