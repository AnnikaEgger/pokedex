<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <link
      rel="shortcut icon"
      href="./assets/icons/pokeball.png"
      type="image/x-icon"
    />

    <!-- CSS files -->
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/pokemon.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="onloadFunc()">
    <!-- <body> -->
    <header>
      <div class="header-left">
        <img
          src="./assets/icons/pokeball.png"
          alt="Pokeball"
          class="pokeball-logo"
        />
        <h1>Pokedex</h1>
      </div>
      <input class="filter-pokemon-input" type="text" />
    </header>
    <main id="main"></main>

    <dialog id="pokemon-dialog" class="pokemon-dialog"></dialog>

    <footer>
      <div class="da-logo">
        <div aria-label="Developer Akademie Logo" class="da-logo-top">
          <img src="./assets/icons/da_icon.svg" alt="Developer Akademie Icon" />
          <img
            src="./assets/icons/da_logo_text.svg"
            alt="Developer Akademie Logo-Text"
          />
        </div>
        <p class="da-logo-bottom">&copy; 2026 Developer Akademie GmbH</p>
      </div>
    </footer>
  </body>

  <!-- scripts -->
  <script src="scripts/templates.js"></script>
  <script src="script.js"></script>
</html>
